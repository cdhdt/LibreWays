org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

# Only configure the projects a given task invocation actually needs. In particular this lets
# :domain build and test without ever configuring :app, so a missing Android SDK does not block
# pure-JVM domain work (see docs/adr/010-module-layout.md and the PR body for what this project's
# environment could and could not verify).
org.gradle.configureondemand=true

kotlin.code.style=official

# Supply-chain integrity: never silently download and execute a JDK from a third-party toolchain
# resolver (e.g. foojay). Every module declares its required JDK version explicitly
# (`jvmToolchain(21)`); Gradle must find it among locally installed JDKs or fail loudly, not fetch
# one automatically. See docs/testing.md for the JDK this project requires and where to get it.
org.gradle.java.installations.auto-download=false

android.useAndroidX=true
# Zero Google Play Services (CLAUDE.md §0.1): no jetifier needed, nothing legacy-support-library
# based is depended upon anywhere in this project.
android.enableJetifier=false
